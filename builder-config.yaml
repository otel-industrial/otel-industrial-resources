# builder-config.yaml
# Builds a custom OpenTelemetry Collector binary with the Modbus receiver.
#
# Prerequisites:
#   go install go.opentelemetry.io/collector/cmd/builder@v0.96.0
#
# Build:
#   builder --config builder-config.yaml
#   # or: make build
#
# NOTE: During local development, the receiver is referenced via `path: ./`
# which points to the local source. Once you tag a release and push to GitHub,
# replace the `path` line with a versioned gomod reference:
#
#   receivers:
#     - gomod: github.com/lukaszciukaj/modbusreceiver v0.1.0
#       # remove the path line

dist:
  name: otelcol-modbus
  description: OpenTelemetry Collector with Modbus TCP receiver
  output_path: ./bin
  otelcol_version: 0.96.0

receivers:
  - gomod: github.com/lukaszciukaj/modbusreceiver v0.0.1
    path: ./   # local dev only — remove after tagging a release

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.96.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.96.0

extensions:
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.96.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v0.96.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v0.96.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v0.96.0