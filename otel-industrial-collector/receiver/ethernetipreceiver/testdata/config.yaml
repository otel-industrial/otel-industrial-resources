# Only the required settings; everything else uses defaults.
ethernetip:
  host: "192.168.1.10"
  tags:
    - temperature

# Every setting the receiver exposes, including the inherited scraper
# controller settings and per-metric/resource-attribute toggles.
ethernetip/all_settings:
  host: "plc-line1.example.internal"
  port: 44818
  device_name: "line1-plc"
  collection_interval: 30s
  initial_delay: 5s
  timeout: 20s
  request_timeout: 2s
  # Backoff between reconnects to a device that is down. The wait grows from
  # initial_interval to max_interval; after max_elapsed_time it stays at
  # max_interval. Reconnects never stop.
  reconnect_on_failure:
    enabled: true
    initial_interval: 15s
    max_interval: 2m
    max_elapsed_time: 10m
  tags:
    - temperature
    - pumpstatus
    - flow_rate
  metrics:
    ethernetip.tag.value:
      enabled: true
  resource_attributes:
    ethernetip.device.name:
      enabled: false
