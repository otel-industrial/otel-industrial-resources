dist:
  name: otelcol-ethernetip
  description: OpenTelemetry Collector with EtherNet/IP receiver
  output_path: ./bin
  otelcol_version: 0.163.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/nopreceiver v0.163.0
  - gomod: github.com/otel-industrial/otel-industrial-resources/otel-industrial-collector/receiver/ethernetipreceiver v0.0.0
    path: ./

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.163.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.163.0

# The receiver uses the in-repo industrialscraper module. OCB ignores replace
# directives in a component's go.mod, so point the build at it here. The path
# is relative to output_path. Remove after tagging an industrialscraper release.
replaces:
  - github.com/otel-industrial/otel-industrial-resources/otel-industrial-collector/industrialscraper => ../../../industrialscraper
