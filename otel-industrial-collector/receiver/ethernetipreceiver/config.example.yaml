receivers:
  ethernetip:
    host: "127.0.0.1"
    port: 44818
    device_name: "line1-plc"
    collection_interval: 5s
    request_timeout: 5s
    # Backoff between reconnects to a device that is down.
    reconnect_on_failure:
      initial_interval: 10s
      max_interval: 60s
    tags:
      - testtag
      - temperature
      - pumpstatus

exporters:
  debug:
    verbosity: detailed

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    metrics:
      receivers: [ethernetip]
      exporters: [debug]
