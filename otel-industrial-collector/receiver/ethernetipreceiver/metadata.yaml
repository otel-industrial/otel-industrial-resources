type: ethernetip
display_name: EtherNet/IP Receiver
description: This receiver polls tags from EtherNet/IP (CIP) devices, such as PLCs, and reports device reachability and tag values as metrics.
github_project: otel-industrial/otel-industrial-resources

status:
  class: receiver
  stability:
    development: [metrics]
  distributions: []
  disable_codecov_badge: true
  codeowners:
    active: [lukaszciukaj]

resource_attributes:
  ethernetip.device.address:
    description: The IP address or hostname of the EtherNet/IP device.
    type: string
    enabled: true
  ethernetip.device.name:
    description: A user-configured name for the device, if provided.
    type: string
    enabled: true

attributes:
  ethernetip.tag.name:
    description: The name of the polled tag.
    type: string

metrics:
  ethernetip.device.up:
    enabled: true
    stability: development
    description: Whether the device responded successfully to the last poll (1) or not (0).
    unit: "1"
    gauge:
      value_type: int
    attributes: []

  ethernetip.tag.value:
    enabled: true
    stability: development
    description: The current value of a polled EtherNet/IP tag, as a float.
    unit: "1"
    gauge:
      value_type: double
    attributes: [ethernetip.tag.name]

tests:
  goleak:
    ignore:
      # The gologix.Server instances started by client_test.go have no clean
      # shutdown path, so their goroutines outlive the tests.
      any:
        - "github.com/danomagnum/gologix.(*Server).Serve"
        - "github.com/danomagnum/gologix.(*Server).serveTCP"
        - "github.com/danomagnum/gologix.(*Server).serveUDP"
  config:
    host: "127.0.0.1"
    port: 44818
    collection_interval: 5s
    timeout: 5s
    tags:
      - testtag
