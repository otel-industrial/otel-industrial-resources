# Only the required settings; everything else uses defaults.
modbus:
  # At least one register is required.
  registers:
    - address: 0
      type: holding_register

# Every setting the receiver exposes.
modbus/all_settings:
  # Modbus TCP endpoint of the device or gateway, as host:port.
  endpoint: "plc-line1.example.internal:502"
  # Modbus unit (slave) ID, 1-247. Selects the device behind a gateway.
  unit_id: 17
  # How often all registers are polled.
  polling_interval: 30s
  # Timeout for connecting and for each request.
  timeout: 2s
  registers:
    # Holding register (FC03) decoded as a 32-bit float from two registers.
    - address: 100
      type: holding_register
      data_type: float32
      # Word-swapped: low 16-bit word first. Check the device manual.
      byte_order: CDAB
      # Optional label, emitted as the modbus.name attribute.
      name: temperature
    # Input register (FC04) decoded as a signed 16-bit integer.
    - address: 4
      type: input_register
      data_type: int16
      byte_order: ABCD
      name: pressure
    # Coil (FC01); bit banks are always bool, so data_type and byte_order can be omitted.
    - address: 0
      type: coil
      name: pump_status
    # Discrete input (FC02).
    - address: 1
      type: discrete_input
      name: valve_open
  # Per-metric settings; unlisted metrics keep their defaults.
  metrics:
    modbus.coil.value:
      enabled: false
