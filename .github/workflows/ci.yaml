name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build-collector:
    name: Build collector binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install ocb
        run: go install go.opentelemetry.io/collector/cmd/builder@v0.152.0

      - name: Build custom collector
        run: builder --config builder-config.yaml --skip-strict-versioning

      - name: Verify binary exists
        run: test -f ./bin/otelcol-modbus