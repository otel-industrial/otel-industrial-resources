name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'   # repo-level version tags (incl. -alpha/-beta); module tags contain '/' and won't match

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Install builder
        run: |
          go install go.opentelemetry.io/collector/cmd/builder@v0.160.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build all collector distributions
        working-directory: otel-industrial-collector/manifests
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make OCB=builder
      - name: Package binaries
        working-directory: otel-industrial-collector/manifests
        run: |
          mkdir -p dist
          for d in otelcol-*/; do
            name="${d%/}"
            tar -czf "dist/${name}_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" -C "$name" "$name"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: otel-industrial-collector/manifests/dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Create draft release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find dist -name '*.tar.gz')
          flags=(--draft --generate-notes --title "$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" "${flags[@]}"
