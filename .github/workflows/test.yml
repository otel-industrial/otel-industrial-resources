name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      # Multi-module repo: test/vet/fmt every module. `go test ./...` does not
      # cross module boundaries, and `find -execdir` hides a failing command's
      # exit code, so loop explicitly and fail if any module fails.
      - name: Test all Go modules
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r mod; do
            dir=$(dirname "$mod")
            echo "== $dir =="
            (
              cd "$dir"
              go vet ./... &&
              { test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; false; }; } &&
              go test ./...
            ) || fail=1
          done < <(find . -name go.mod -not -path '*/vendor/*')
          exit $fail
      # mdatagen output is committed. Regenerate every component that has a
      # metadata.yaml with the mdatagen pinned in
      # otel-industrial-collector/internal/tools, and fail if anything changed
      # (including new files the generator would add).
      - name: Check generated code is up to date
        run: |
          set -euo pipefail
          while IFS= read -r meta; do
            dir=$(dirname "$meta")
            echo "== $dir =="
            make -C "$dir" generate
          done < <(find . -name metadata.yaml -not -path '*/vendor/*' -not -path '*/testdata/*')
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git --no-pager diff
            echo "Generated code is out of date. Run 'make generate' in the components listed above and commit the result."
            exit 1
          fi
