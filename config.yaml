receivers:
  modbus:
    endpoint: "localhost:5020"
    unit_id: 1
    polling_interval: 5s
    timeout: 5s
    registers:
      - address: 0
        type: holding_register
        data_type: float32
        byte_order: ABCD
        name: "temperature"
      - address: 2
        type: holding_register
        data_type: uint16
        byte_order: ABCD
        name: "pressure"
      - address: 3
        type: holding_register
        data_type: uint16
        byte_order: ABCD
        name: "humidity"
      - address: 4
        type: holding_register
        data_type: float32
        byte_order: ABCD
        name: "flow_rate"
      - address: 0
        type: coil
        data_type: bool
        name: "pump_status"
      - address: 1
        type: coil
        data_type: bool
        name: "valve_status"

exporters:
  debug:
    verbosity: detailed

extensions:
  zpages:
    endpoint: "localhost:55679"

service:
  extensions: [zpages]
  pipelines:
    metrics:
      receivers: [modbus]
      exporters: [debug]
